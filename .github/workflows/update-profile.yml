name: Update profile README

on:
  schedule:
    - cron: '0 2 * * 1' # Mondays 02:00 UTC (10:00 Beijing)
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - projects.json
      - scripts/update-projects.mjs
      - .github/workflows/update-profile.yml

permissions:
  contents: write

concurrency:
  group: update-profile-readme
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Regenerate project lists
        run: node scripts/update-projects.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "No changes to README.md"
          else
            git commit -m "chore: auto-sync project list"
            git push
          fi
